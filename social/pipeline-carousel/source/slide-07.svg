<text x="104" y="750" fill="#9fb1cc" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" text-anchor="start"><tspan x="104" dy="0">Citations complete</tspan><tspan x="104" dy="42.5">Provenance</tspan><tspan x="104" dy="42.5">sufficient</tspan><tspan x="104" dy="42.5">Contradictions</tspan><tspan x="104" dy="42.5">resolved</tspan></text>
<rect x="560" y="650" width="448" height="440" rx="18" fill="#15253d" fill-opacity="1.0" stroke="#f4c768" stroke-width="3"/>
<rect x="560" y="650" width="10" height="440" rx="5" fill="#f4c768" fill-opacity="1.0" stroke="#f4c768" stroke-width="0"/>
