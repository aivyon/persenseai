<text x="592" y="750" fill="#9fb1cc" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" text-anchor="start"><tspan x="592" dy="0">Required modality</tspan><tspan x="592" dy="42.5">missing</tspan><tspan x="592" dy="42.5">Budget exhausted</tspan><tspan x="592" dy="42.5">Conflict unresolved</tspan></text>
<text x="296" y="1142" fill="#4ad5a5" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="0">answer with citations</text>
<text x="784" y="1142" fill="#f4c768" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="0">do not fabricate</text>
