<text x="72" y="409.6" fill="#9fb1cc" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="500" text-anchor="start"><tspan x="72" dy="0">The pipeline returns a grounded answer only when</tspan><tspan x="72" dy="47.6">citations, provenance, uncertainty, and</tspan><tspan x="72" dy="47.6">contradiction conditions are satisfied.</tspan></text>
