<text x="72" y="248" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" text-anchor="start"><tspan x="72" dy="0">6. Answer — or stop</tspan><tspan x="72" dy="75.6">honestly</tspan></text>
