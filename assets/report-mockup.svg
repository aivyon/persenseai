<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">PersenseAI report mockup</title>
  <desc id="desc">Diagnostic report card with SHAP-style feature contribution bars.</desc>
  <defs><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0d1b34"/><stop offset="1" stop-color="#070f1f"/></linearGradient><linearGradient id="hot" x1="0" x2="1"><stop stop-color="#ff8ed7"/><stop offset="1" stop-color="#ff68c8"/></linearGradient><linearGradient id="cool" x1="0" x2="1"><stop stop-color="#31e8ff"/><stop offset="1" stop-color="#8df5ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="900" height="640" rx="38" fill="#050914"/>
  <rect x="34" y="34" width="832" height="572" rx="30" fill="url(#panel)" stroke="#7fc6ff" stroke-opacity=".22"/>
  <rect x="34" y="34" width="832" height="74" rx="30" fill="#050914" opacity=".62"/>
  <circle cx="72" cy="72" r="7" fill="#6dffb8" filter="url(#glow)"/>
  <text x="96" y="79" fill="#9db1c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800">VISUAL DEBUG REPORT</text>
  <text x="706" y="79" fill="#ff68c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">severity: high</text>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="72" y="164" fill="#31e8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">LIKELY FAILURE</text><text x="72" y="205" fill="#edf7ff" font-size="34" font-weight="850">ID switch after occlusion</text>
    <text x="72" y="276" fill="#31e8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">EVIDENCE</text><text x="72" y="314" fill="#edf7ff" font-size="24" font-weight="760">embedding spike + bbox jump + frame gap</text>
    <text x="72" y="386" fill="#31e8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">FEATURE CONTRIBUTION</text>
  </g>
  <g transform="translate(72 420)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">
    <text x="0" y="18" fill="#9db1c8">embedding_distance</text><rect x="220" y="0" width="430" height="26" rx="13" fill="url(#hot)"/><text x="668" y="18" fill="#ff8ed7">+0.34</text>
    <text x="0" y="62" fill="#9db1c8">bbox_jump</text><rect x="220" y="44" width="350" height="26" rx="13" fill="url(#hot)" opacity=".86"/><text x="588" y="62" fill="#ff8ed7">+0.27</text>
    <text x="0" y="106" fill="#9db1c8">frame_gap</text><rect x="220" y="88" width="276" height="26" rx="13" fill="url(#hot)" opacity=".72"/><text x="514" y="106" fill="#ff8ed7">+0.18</text>
    <text x="0" y="150" fill="#9db1c8">motion_consistency</text><rect x="220" y="132" width="180" height="26" rx="13" fill="url(#cool)" opacity=".9"/><text x="418" y="150" fill="#31e8ff">-0.07</text>
  </g>
</svg>
